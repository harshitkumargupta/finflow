spring.application.name=finflow

spring.datasource.url=${FINFLOW_DB_URL}
spring.datasource.username=${FINFLOW_DB_USERNAME}
spring.datasource.password=${FINFLOW_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=FinFlow existing schema baseline
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=8080

management.endpoints.web.exposure.include=health,info
jwt.secret=${FINFLOW_JWT_SECRET:}
jwt.expiration=${FINFLOW_JWT_EXPIRATION_MS:86400000}
logging.level.org.springframework.security=WARN

finflow.news.provider=${NEWS_PROVIDER:NONE}
finflow.news.api-key=${NEWS_API_KEY:}
finflow.news.cache-minutes=${NEWS_CACHE_MINUTES:15}
finflow.market.provider=${MARKET_DATA_PROVIDER:NONE}
finflow.market.api-key=${MARKET_API_KEY:}
finflow.market.price-provider=${MARKET_PRICE_PROVIDER:NONE}
finflow.webhook.secret=${FINFLOW_WEBHOOK_SECRET:}
finflow.webhook.timestamp-tolerance-seconds=${FINFLOW_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:300}
finflow.webhook.providers=${FINFLOW_WEBHOOK_PROVIDERS:FINFLOW_SANDBOX_PROVIDER}
finflow.rate-limit.login-per-window=${FINFLOW_RATE_LIMIT_LOGIN:10}
finflow.rate-limit.register-per-window=${FINFLOW_RATE_LIMIT_REGISTER:5}
finflow.rate-limit.pin-per-window=${FINFLOW_RATE_LIMIT_PIN:12}
finflow.rate-limit.qr-per-window=${FINFLOW_RATE_LIMIT_QR:30}
finflow.rate-limit.otp-per-window=${FINFLOW_RATE_LIMIT_OTP:5}
finflow.rate-limit.window-seconds=${FINFLOW_RATE_LIMIT_WINDOW_SECONDS:60}
finflow.phone.channel=${PHONE_VERIFICATION_CHANNEL:EMAIL}
finflow.phone.otp-ttl-minutes=${PHONE_OTP_TTL_MINUTES:10}
finflow.phone.max-attempts=${PHONE_OTP_MAX_ATTEMPTS:5}
finflow.receipt.provider=${RECEIPT_SCAN_PROVIDER:NONE}
finflow.receipt.tesseract.language=${RECEIPT_TESSERACT_LANGUAGE:eng}
finflow.receipt.tesseract.data-path=${RECEIPT_TESSERACT_DATA_PATH:}
finflow.receipt.tesseract.library-path=${RECEIPT_TESSERACT_LIB_PATH:}
finflow.receipt.max-bytes=${RECEIPT_SCAN_MAX_BYTES:5000000}
finflow.insight.provider=${INSIGHT_NARRATION_PROVIDER:NONE}
finflow.insight.huggingface.token=${HUGGINGFACE_API_TOKEN:}
finflow.insight.huggingface.model=${HUGGINGFACE_MODEL:meta-llama/Llama-3.1-8B-Instruct}
finflow.insight.huggingface.api-url=${HUGGINGFACE_API_URL:https://router.huggingface.co/v1/chat/completions}
finflow.insight.timeout-ms=${INSIGHT_NARRATION_TIMEOUT_MS:8000}
finflow.insight.max-tokens=${INSIGHT_NARRATION_MAX_TOKENS:220}
finflow.reports.monthly.enabled=${FINFLOW_MONTHLY_REPORT_ENABLED:true}
finflow.reports.monthly.cron=${FINFLOW_MONTHLY_REPORT_CRON:0 0 7 1 * *}
finflow.reports.monthly.zone=${FINFLOW_MONTHLY_REPORT_ZONE:UTC}
spring.servlet.multipart.max-file-size=${RECEIPT_SCAN_MAX_UPLOAD:6MB}
spring.servlet.multipart.max-request-size=${RECEIPT_SCAN_MAX_UPLOAD:6MB}
finflow.money.maximum=${FINFLOW_MONEY_MAXIMUM:1000000000.00}
finflow.mail.host=${MAIL_HOST:}
finflow.mail.port=${MAIL_PORT:587}
finflow.mail.username=${MAIL_USERNAME:}
finflow.mail.password=${MAIL_PASSWORD:}
finflow.mail.from=${MAIL_FROM:}
finflow.mail.starttls=${MAIL_STARTTLS:true}
finflow.mail.verification-ttl-hours=24
finflow.app.base-url=${APP_BASE_URL:http://localhost:5173}
